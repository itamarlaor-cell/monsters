<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>ציירו ולחמו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karantina:wght@700&display=swap">
<style>
/* Layout: one full-screen stage canvas (the arena world, with a movie camera) and chunky screens layered on top */
:root{
  --night:#140f26; --night2:#241a44; --paper:#fbf5e6; --ink:#0b0716;
  --gold:#ffc93c; --hot:#ff4d5a; --mint:#2fd68a; --sky:#3fc1f0; --grape:#9b5de5;
  --fg:#fff8ec; --muted:#c3b8e2;
  --f-display:"Karantina","Fredoka","Arial Hebrew",sans-serif;
  --f-ui:"Fredoka","Rubik","Arial Hebrew","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--fg);font-family:var(--f-ui);overflow:hidden;direction:rtl;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;overflow-y:auto}
.dim{background:radial-gradient(ellipse at center,rgba(20,15,38,.5),rgba(20,15,38,.93))}
.solid{background:radial-gradient(ellipse at 50% 30%,var(--night2),var(--night))}
h1.logo{font-family:var(--f-display);font-size:clamp(64px,15vw,150px);line-height:.85;margin:0;text-align:center;color:var(--gold);
  text-shadow:0 5px 0 var(--ink),0 0 34px rgba(255,140,40,.45);transform:rotate(-3deg)}
h1.logo span{color:var(--hot);display:inline-block;transform:rotate(4deg) translateY(4px)}
.sub{font-size:clamp(16px,3.6vw,22px);color:var(--muted);text-align:center;margin:0;max-width:30em;text-wrap:balance}
h2.big{font-family:var(--f-display);font-size:clamp(44px,10vw,88px);line-height:.95;margin:0;text-align:center;color:var(--fg);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.btn{font-family:var(--f-ui);font-weight:700;font-size:clamp(20px,4.6vw,28px);color:var(--ink);background:var(--gold);border:4px solid var(--ink);border-radius:20px;
  padding:14px 28px;min-height:64px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn.hot{background:var(--hot);color:#fff}.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.ghost{background:var(--paper)}
.btn.small{font-size:18px;min-height:48px;padding:8px 18px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.btn.huge{font-size:clamp(28px,7vw,44px);min-height:84px;padding:14px 40px;border-radius:26px}
.btn[disabled]{opacity:.45;pointer-events:none}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.wob{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.03)}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.namebox{display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(255,248,236,.07);border:3px solid rgba(255,248,236,.18);border-radius:22px;padding:14px;min-width:0}
.namebox label{font-size:20px;font-weight:700}
.nameline{display:flex;gap:8px;align-items:center}
.nameline input{font-family:var(--f-ui);font-size:26px;font-weight:600;width:min(220px,52vw);padding:10px 14px;border-radius:16px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);text-align:center}
.nameline input:focus-visible{outline:4px solid var(--sky)}
.dice{width:56px;height:56px;border-radius:16px;border:4px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.dice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dice svg{width:30px;height:30px}
.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mode{font-family:var(--f-ui);font-weight:700;font-size:19px;color:var(--fg);background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px}
.mode small{font-weight:500;font-size:14px;color:var(--muted)}
.mode.on{border-color:var(--gold);background:rgba(255,201,60,.16);box-shadow:0 0 18px rgba(255,201,60,.35)}
.corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
.iconbtn.on{background:var(--gold)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
body.fighting .corner{opacity:.35}
/* code */
.code{display:flex;gap:10px;direction:ltr}
.code b{font-family:var(--f-display);font-size:clamp(64px,16vw,110px);width:clamp(64px,16vw,104px);height:clamp(84px,20vw,130px);display:grid;place-items:center;background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);line-height:1}
.code b.empty{color:transparent}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;direction:ltr}
.keypad button{font-family:var(--f-display);font-size:44px;height:70px;border-radius:18px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.keypad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.status{font-size:20px;color:var(--muted);text-align:center;min-height:1.4em;max-width:26em}
.status.ok{color:var(--mint)}.status.bad{color:var(--hot)}
/* arena picker */
.arenas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:980px}
.atile{position:relative;border:4px solid var(--ink);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;background:#000;box-shadow:0 5px 0 var(--ink);aspect-ratio:16/10;min-width:0}
.atile img{width:100%;height:100%;object-fit:cover;display:block}
.atile span{position:absolute;inset:auto 0 0 0;padding:6px 8px;font-weight:700;font-size:clamp(14px,2.6vw,19px);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
.atile:hover,.atile:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-2px)}
.atile[disabled]{cursor:default;filter:saturate(.7)}
.atile.sel{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,201,60,.7)}
@media (max-width:760px){.arenas{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
/* draw screen */
#drawScreen{justify-content:flex-start;gap:10px;padding-top:calc(62px + env(safe-area-inset-top,0px))}
.drawTop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;max-width:1100px}
.foe{position:relative;display:inline-block;width:76px;height:64px;border:3px solid #ffc93c;border-radius:14px;background:#1b1430;box-shadow:0 0 18px rgba(255,201,60,.5)}.foe img{width:100%;height:100%;object-fit:contain}.foe i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:30px;height:24px}.foe i svg{width:100%;height:100%}
.btn svg{width:1.2em;height:1.2em}
.turnTag{font-family:var(--f-display);font-size:clamp(36px,7vw,56px);line-height:1;color:var(--fg);text-shadow:0 3px 0 var(--ink)}
.chip{font-size:17px;font-weight:600;padding:6px 14px;border-radius:999px;background:rgba(255,248,236,.12);border:2px solid rgba(255,248,236,.25);display:inline-flex;gap:6px;align-items:center}
.chip svg{width:20px;height:20px}
.drawMain{display:flex;gap:16px;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;flex-wrap:wrap}
.padWrap{position:relative;flex:0 0 auto;border:5px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink),0 0 0 8px rgba(255,248,236,.06);overflow:hidden;background:var(--paper)}
#pad{display:block;touch-action:none;cursor:crosshair}
.padCover{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#2b2150 0 22px,#33285e 22px 44px);color:var(--fg);font-family:var(--f-display);font-size:clamp(34px,7vw,60px);text-align:center;pointer-events:none;padding:20px;line-height:1}
.padMsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);font-weight:700;font-size:18px;padding:6px 14px;border-radius:12px;pointer-events:none;white-space:nowrap}
.tools{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
.palette{display:grid;grid-template-columns:repeat(4,50px);gap:9px}
.sw{width:50px;height:50px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);padding:0;position:relative}
.sw.on{transform:scale(1.12);box-shadow:0 0 0 4px var(--fg),0 4px 0 var(--ink)}
.sw[disabled]{opacity:.18;pointer-events:none}
.pens{display:flex;flex-direction:column;gap:6px;align-items:center;background:linear-gradient(160deg,rgba(255,140,40,.12),rgba(80,180,255,.12));border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:8px 10px}
.pens b{font-size:16px;color:var(--gold)}
.penrow{display:flex;gap:8px}
.pen{width:56px;height:56px;border-radius:16px;border:4px solid var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;color:#fff;position:relative}
.pen svg{width:30px;height:30px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.pen.on{transform:scale(1.12);box-shadow:0 0 0 4px var(--fg),0 0 22px currentColor}
.pen-fire svg{animation:flick .35s ease-in-out infinite alternate}.pen-ice svg{animation:twinkle 1.6s linear infinite}.pen-bolt svg{animation:zapA .9s steps(2) infinite}.pen-metal svg{animation:shine 2s ease-in-out infinite}
@keyframes flick{from{transform:scale(1) translateY(0)}to{transform:scale(1.15,1.25) translateY(-2px)}}@keyframes twinkle{to{transform:rotate(60deg)}}@keyframes zapA{50%{transform:scale(1.2) rotate(-8deg);filter:drop-shadow(0 0 6px #fff)}}@keyframes shine{50%{transform:rotate(-10deg) scale(1.08);filter:drop-shadow(0 0 5px #fff)}}
.pen svg{width:34px;height:34px}
.inkbar{width:100%;height:14px;border:3px solid var(--ink);border-radius:8px;background:#2a2042;overflow:hidden;position:relative}
.inkbar i{position:absolute;inset:0 0 0 auto;background:linear-gradient(90deg,#ff8a00,#ffe600,#7fe3ff,#c9d1de);transition:width .15s}
.toolrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.tool{width:54px;height:54px;border-radius:16px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.tool svg{width:28px;height:28px}
.tool.on{background:var(--gold)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.size i{display:block;border-radius:50%;background:var(--ink)}
.wardrobe{display:grid;grid-template-columns:repeat(4,58px);gap:7px;justify-content:center;background:linear-gradient(160deg,rgba(255,79,163,.16),rgba(63,193,240,.14));padding:8px;border-radius:16px;border:2px solid rgba(255,255,255,.2)}
.item{width:58px;height:58px;border-radius:14px;border:3px solid var(--ink);background:#fbf5e6;cursor:pointer;padding:3px;box-shadow:0 3px 0 var(--ink)}
.item img{width:100%;height:100%;object-fit:contain;display:block}.item.on{background:#ffc93c;transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 3px 0 var(--ink)}
.tool.ward{background:linear-gradient(160deg,#ff8fc7,#ffc93c);animation:wob 2.4s ease-in-out infinite}
.worn{position:absolute;top:8px;right:8px;display:flex;gap:4px;pointer-events:none}.worn img{width:46px;height:46px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:12px;padding:2px}
@media (orientation:portrait),(max-width:760px){.wardrobe{grid-template-columns:repeat(6,46px);gap:5px}.item{width:46px;height:46px}.worn img{width:34px;height:34px}}
.stamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,248,236,.08);padding:8px;border-radius:16px}
@media (orientation:portrait),(max-width:760px){
  .palette{grid-template-columns:repeat(8,minmax(0,38px));gap:5px}.sw{width:38px;height:38px;border-width:3px}
  .tool{width:42px;height:42px;border-width:3px}.tool svg{width:22px;height:22px}.toolrow{gap:6px;flex-wrap:nowrap}.pen{width:48px;height:48px}.pen svg{width:26px;height:26px}
  .pens{flex-direction:row;flex-wrap:wrap;justify-content:center}.pens b{width:100%;text-align:center}
}
/* cards */
.cards{display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%;max-width:980px}
.card{flex:1 1 280px;max-width:420px;min-width:0;background:linear-gradient(165deg,#271c44,#100a1e);color:var(--fg);border:4px solid var(--ec,#9b5de5);border-radius:20px;padding:12px 16px;
  box-shadow:0 0 0 3px #07040c,0 0 30px var(--ec,#9b5de5),0 8px 0 #07040c;display:flex;flex-direction:column;gap:7px;animation:cardIn .5s cubic-bezier(.2,1.6,.4,1) both}
.card:nth-child(2){animation-delay:.15s}
@keyframes cardIn{from{transform:translateY(40px) scale(.7) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.card .pic{display:block;width:100%;height:clamp(90px,18vh,170px);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.card .owner{font-size:15px;font-weight:600;opacity:.75}
.card .cname{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:40px;line-height:1}
.card .cname button{width:40px;height:40px;border-radius:12px;border:3px solid #07040c;background:#2e2350;color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.card .cname button svg{width:22px;height:22px}
.elpill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:17px;color:#fff;padding:3px 11px;border-radius:999px;border:3px solid var(--ink);width:max-content}
.elpill svg{width:18px;height:18px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-weight:600;font-size:16px}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:13px;border-radius:5px;border:2.5px solid #07040c;background:#2e2350}
.pips i.on{background:var(--c,var(--hot))}
.why{font-size:16px;font-weight:600;background:rgba(255,255,255,.07);border-radius:12px;padding:7px 10px;border:2px dashed rgba(255,255,255,.28)}
.matchup{font-family:var(--f-display);font-size:clamp(28px,5.5vw,44px);color:var(--gold);text-align:center;text-shadow:0 3px 0 var(--ink);line-height:1.05;text-wrap:balance}
.twist{width:min(380px,86vw);background:var(--paper);color:var(--ink);border:6px solid var(--ink);border-radius:26px;padding:20px;box-shadow:0 10px 0 var(--ink);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.twist.flip{animation:flip 1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{0%{transform:rotateY(180deg) scale(.6)}60%{transform:rotateY(-12deg) scale(1.05)}100%{transform:rotateY(0) scale(1)}}
.twist .t{font-family:var(--f-display);font-size:clamp(44px,10vw,62px);line-height:1;color:var(--hot)}
.twist .d{font-size:20px;font-weight:600}
.twist .ico svg{width:80px;height:80px;display:block}
.arenaName{font-family:var(--f-display);font-size:clamp(40px,9vw,70px);color:var(--gold);text-shadow:0 4px 0 var(--ink);line-height:1}
/* HUD (lives inside the movie letterbox) */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
.hbar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));width:min(40vw,430px);display:flex;flex-direction:column;gap:4px}
.hbar.R{right:max(14px,env(safe-area-inset-right,0px))}
.hbar.L{left:max(14px,env(safe-area-inset-left,0px));align-items:flex-end}
.hname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(14px,2.8vw,21px);pointer-events:auto;max-width:100%;min-width:0}
.hname .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:var(--f-display);font-size:1.45em;line-height:1}
.hbar.L .hname{flex-direction:row-reverse}
.hpo{height:clamp(14px,2.4vw,20px);border:3px solid #000;border-radius:10px;background:#2b2140;position:relative;overflow:hidden;width:100%}
.hpo i{position:absolute;top:0;bottom:0;right:0}
.hbar.L .hpo i{right:auto;left:0}
.hpo .trail{background:#fff;opacity:.85;transition:width .7s .3s}
.hpo .fill{background:linear-gradient(180deg,#86ff9f,#18a957);transition:width .18s}
.hpo .fill.mid{background:linear-gradient(180deg,#ffe066,#f08c00)}
.hpo .fill.low{background:linear-gradient(180deg,#ff8a8a,#d92b2b)}
.pipsW{display:flex;gap:5px}
.pipsW i{width:15px;height:15px;border-radius:50%;border:3px solid #000;background:#3a2c55}
.pipsW i.on{background:var(--gold)}
.qte{position:absolute;bottom:calc(16% + env(safe-area-inset-bottom,0px));width:clamp(130px,26vw,190px);height:clamp(130px,26vw,190px);border-radius:50%;border:6px solid #000;pointer-events:auto;cursor:pointer;
  font-family:var(--f-display);font-size:clamp(44px,9vw,64px);color:#fff;text-shadow:0 3px 0 #000;display:grid;place-items:center;padding:0;
  background:radial-gradient(circle,#ffe27a,#ff7a00 62%,#b33900);box-shadow:0 0 0 6px rgba(255,200,60,.4),0 0 40px #ff9a1a;animation:qin .25s cubic-bezier(.2,1.8,.4,1) both,pulse .45s .25s infinite}
.qte.R{right:max(6%,env(safe-area-inset-right,0px))}.qte.L{left:max(6%,env(safe-area-inset-left,0px))}
.qte svg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg);overflow:visible}
.qte svg circle{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round}
.coopL{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:min(34vw,330px);display:flex;flex-direction:column;gap:6px}
.coopL .hbar{position:relative;top:auto;left:auto;width:100%}
.coopL .hname{font-size:clamp(12px,2.2vw,17px)}
.hbar.boss{width:min(44vw,500px)}
.hbar.boss .hpo{height:clamp(20px,3.4vw,30px);border-width:4px;box-shadow:0 0 18px rgba(255,60,60,.45)}
.hbar.boss .hpo .fill{background:linear-gradient(180deg,#ff8a8a,#c01f3a)}
.qte.guardbtn{background:radial-gradient(circle,#dff6ff,#4cc9f0 58%,#1d5fa5);box-shadow:0 0 0 6px rgba(120,210,255,.45),0 0 40px #4cc9f0}
.qte svg.shi{position:relative;inset:auto;transform:none;width:58%;height:58%}
.cmap{display:flex;align-items:center;justify-content:center;gap:0;direction:ltr;flex-wrap:nowrap;max-width:96vw;margin:10px 0}
.cnode{position:relative;width:clamp(54px,13vw,110px);height:clamp(54px,13vw,110px);border-radius:50%;border:4px solid #000;background:#2b2140;display:grid;place-items:center;flex:none}
.cnode img{width:86%;height:86%;object-fit:contain}
.cnode b{position:absolute;bottom:-10px;right:-6px;width:32px;height:32px;border-radius:50%;border:3px solid #000;background:#3a2c55;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.cnode.lock img{filter:brightness(0) opacity(.75)}
.cnode.lock{opacity:.75}

/* ======================= CO-OP QUEST — the two of you against the computer's monsters =======================
   A path of 5 computer monsters, each in its own arena, each bigger than the last. Your two monsters fight side by side.
   - Turns go: monster 1, monster 2, computer. Every other round your two monsters strike TOGETHER (team attack).
   - Before the computer hits, it glows and aims at one of you: that player taps the shield in time to block most of it.
   - The computer monster has a shape it is weak to (shown in pictures). Drawing that shape hits it harder.
   - Win: the monster that landed the last blow eats a piece of it and grows; on to the next stage, same monsters.
   - Lose (both monsters down): try again — every retry the computer monster starts weaker, so nobody gets stuck. */
